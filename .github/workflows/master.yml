name: Build & Publish DravusSensorPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Self‑contained build for Windows (win‑x64)
  # single‑file (.NET not required.)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Publish self-contained win-x64
        shell: bash
        run: |
          dotnet publish DravusSensorPanel.csproj \
            -c Release \
            -r win-x64 \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DravusSensorPanel_win-x64
          path: ./publish/win-x64
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Framework‑dependent portable build
  # ─────────────────────────────────────────────────────────────────────────────
  build-portable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Publish portable (framework-dependent)
        run: |
          dotnet publish DravusSensorPanel.csproj \
            -c Release \
            -f net8.0 \
            -p:PublishSingleFile=false \
            -o ./publish/portable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DravusSensorPanel_portable
          path: ./publish/portable
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux self-contained
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-musl-x64]  # glibc e musl
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install musl tools (only for musl)
        if: matrix.rid == 'linux-musl-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Restore
        run: dotnet restore

      - name: Publish self-contained ${{ matrix.rid }}
        run: |
          dotnet publish DravusSensorPanel.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/${{ matrix.rid }}

      - name: Upload artifact (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: DravusSensorPanel_${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}
          retention-days: 30

    
